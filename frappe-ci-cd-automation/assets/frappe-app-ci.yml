# GitHub Actions CI pipeline for a Frappe app.
# Modelled on frappe/.github/workflows/linters.yml and _base-server-tests.yml (frappe 16.35.0).
# Adjust python-version, node-version, and frappe-branch to match your pyproject.toml.
#
# Required GitHub Secrets:
#   DB_ROOT_PASSWORD  — MariaDB root password used only in CI
#   SENTRY_DSN        — (optional) passed to FRAPPE_SENTRY_DSN

name: CI

on:
  push:
    branches:
      - develop
      - version-15
      - version-16
  pull_request:
    branches:
      - develop
      - version-15
      - version-16

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

env:
  DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}

jobs:
  # ─── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (pre-commit / ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: pre-commit/action@v3.0.1

  # ─── Semgrep ─────────────────────────────────────────────────────────────────
  semgrep:
    name: Semgrep (frappe/semgrep-rules)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Download Frappe semgrep rules
        run: git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules

      - name: Run semgrep
        run: |
          pip install semgrep
          semgrep ci --config ./frappe-semgrep-rules/rules --config r/python.lang.correctness

  # ─── Tests ───────────────────────────────────────────────────────────────────
  tests:
    name: Tests (MariaDB 11.8)
    runs-on: ubuntu-latest
    needs: lint

    services:
      mariadb:
        image: mariadb:11.8
        env:
          # env.* expansion works in services; secrets.* does not
          MARIADB_ROOT_PASSWORD: ${{ env.DB_ROOT_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=3

    steps:
      - uses: actions/checkout@v6
        with:
          # Fetch full history so bench get-app can resolve the branch
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install Redis
        # Frappe uses system redis-server, not a Docker service container
        run: sudo apt-get install -y redis-server

      - name: Install Bench
        run: pip install frappe-bench

      - name: Init Bench
        # --skip-assets defers the slow JS build; we build separately below
        run: bench init --frappe-branch version-16 --skip-assets frappe-bench

      - name: Get App
        run: |
          cd frappe-bench
          bench get-app ${{ github.workspace }}

      - name: Create Test Site
        run: |
          cd frappe-bench
          bench new-site \
            --db-root-password "${{ env.DB_ROOT_PASSWORD }}" \
            --admin-password admin \
            test_site
          bench --site test_site install-app ${{ github.event.repository.name }}
          bench --site test_site set-config allow_tests 1 --parse

      - name: Run Tests
        run: |
          cd frappe-bench
          bench --site test_site run-tests \
            --app "${{ github.event.repository.name }}" \
            --coverage
        env:
          FRAPPE_SENTRY_DSN: ${{ secrets.SENTRY_DSN || '' }}

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        if: success()
        with:
          files: ./frappe-bench/sites/coverage.xml

      - name: Show bench logs on failure
        if: failure()
        run: |
          cat frappe-bench/bench_start.log 2>/dev/null || true
          ls frappe-bench/logs/ 2>/dev/null && cat frappe-bench/logs/*.log 2>/dev/null || true

  # ─── Asset Build ─────────────────────────────────────────────────────────────
  build-assets:
    name: Build Assets
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Bench
        run: pip install frappe-bench

      - name: Install Redis
        run: sudo apt-get install -y redis-server

      - name: Init Bench
        run: bench init --frappe-branch version-16 --skip-redis-config-generation frappe-bench

      - name: Get App
        run: |
          cd frappe-bench
          bench get-app ${{ github.workspace }}

      - name: Build App Assets
        run: |
          cd frappe-bench
          bench build --app "${{ github.event.repository.name }}"

  # ─── Vulnerable dependency check ─────────────────────────────────────────────
  deps-audit:
    name: Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit --desc on .
